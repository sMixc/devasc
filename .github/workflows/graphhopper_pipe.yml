name: CI/CD for RouteMatch

env:
  GRAPH_HOPPER_KEY: ${{ secrets.GRAPH_HOPPER_KEY }}
  TOMTOM_KEY: ${{ secrets.TOMTOM_KEY }}

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || pip install streamlit requests folium streamlit-folium pytest

      - name: Run syntax check
        run: python -m py_compile graphhopper_project.py

      - name: Run tests
        run: pytest -v || echo "⚠️ No tests found, skipping."

  merge:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge dev -> main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin main
          git checkout main
          git merge origin/dev -m "Auto-merge dev -> main after passing tests"
          git pull --rebase origin main || true
          git push origin main || echo "⚠️ Merge already up to date or conflict."
