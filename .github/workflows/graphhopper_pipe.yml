name: CI/CD for RouteMatch
env:
      GRAPH_HOPPER_KEY: ${{secrets.GRAPH_HOPPER_KEY}}

on:
  push:
    branches: [ dev ]  # work on 'dev' branch, test changes here first
  pull_request:
    branches: [ dev ]

jobs:
  test:
    runs-on: ubuntu-latest
    

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || pip install streamlit requests folium streamlit-folium pytest

      - name: Run syntax check
        run: python -m py_compile graphhopper_project.py

      - name: Run tests
        run: pytest -v || echo "⚠️ No tests found, skipping."

  deploy:
    needs: test     # only run if 'test' job passes
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev'  # only deploys when dev is updated

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge dev -> main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin main
          git checkout main
          git merge --no-ff origin/dev -m "Auto-merge from dev to main after passing tests"
          git push origin main
